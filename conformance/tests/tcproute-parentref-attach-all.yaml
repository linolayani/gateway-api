apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: tcp-attach-all-gateway
  namespace: gateway-conformance-infra
spec:
  gatewayClassName: "{GATEWAY_CLASS_NAME}"
  listeners:
    - name: one
      protocol: TCP
      port: 9310
      allowedRoutes:
        kinds:
          - kind: TCPRoute
    - name: two
      protocol: TCP
      port: 9311
      allowedRoutes:
        kinds:
          - kind: TCPRoute
    - name: three
      protocol: TCP
      port: 9312
      allowedRoutes:
        kinds:
          - kind: TCPRoute
    - name: four
      protocol: TCP
      port: 9313
      allowedRoutes:
        kinds:
          - kind: TCPRoute
---
# parentRef with neither `port` nor `sectionName`. Should attach to every TCP
# listener on the Gateway, so traffic to any of the four listeners must reach
# the same backend.
apiVersion: gateway.networking.k8s.io/v1
kind: TCPRoute
metadata:
  name: tcp-route-attach-all
  namespace: gateway-conformance-infra
spec:
  parentRefs:
    - name: tcp-attach-all-gateway
  rules:
    - backendRefs:
        - name: tcp-backend
          port: 3000
