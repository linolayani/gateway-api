apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: udp-attach-all-listeners-gateway
  namespace: gateway-conformance-infra
spec:
  gatewayClassName: "{GATEWAY_CLASS_NAME}"
  listeners:
    - name: udp-1
      protocol: UDP
      port: 5310
      allowedRoutes:
        kinds:
          - kind: UDPRoute
    - name: udp-2
      protocol: UDP
      port: 5311
      allowedRoutes:
        kinds:
          - kind: UDPRoute
    - name: udp-3
      protocol: UDP
      port: 5312
      allowedRoutes:
        kinds:
          - kind: UDPRoute
---
# A UDPRoute with no `port` and no `sectionName` set on its parentRef should
# attach to every UDP listener on the Gateway.
apiVersion: gateway.networking.k8s.io/v1
kind: UDPRoute
metadata:
  name: udp-route-attach-all
  namespace: gateway-conformance-infra
spec:
  parentRefs:
    - name: udp-attach-all-listeners-gateway
  rules:
    - backendRefs:
        - name: udp-echo
          port: 8080
